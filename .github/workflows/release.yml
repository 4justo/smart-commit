name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build on ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: smartcommit-linux-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: smartcommit-darwin-aarch64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: smartcommit-darwin-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: smartcommit-windows-x86_64.exe

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          target: ${{ matrix.target }}
          override: true

      - name: Build release binary
        uses: actions-rs/cargo@v1
        with:
          command: build
          args: --release --target ${{ matrix.target }} --package smartcommit-cli

      - name: Rename binary
        run: |
          if [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
            mv target/${{ matrix.target }}/release/smc ${{ matrix.artifact_name }}
          else
            mv target/${{ matrix.target }}/release/smc ${{ matrix.artifact_name }}
          fi
          chmod +x ${{ matrix.artifact_name }}

      - name: Upload artifact
        uses: actions/upload-artifact@v3
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Download artifacts
        uses: actions/download-artifact@v3
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/smartcommit-linux-x86_64
            artifacts/smartcommit-darwin-aarch64
            artifacts/smartcommit-darwin-x86_64
            artifacts/smartcommit-windows-x86_64.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
