[package]
name = "smartcommit-core"
version.workspace = true
edition.workspace = true

[lib]
name = "smartcommit_core"
path = "src/lib.rs"

[dependencies]
thiserror = "1"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
toml = "0.5"

[features]
default = ["ai"]
ai = ["reqwest", "tokio", "serde_json", "async-trait"]

[dependencies.reqwest]
version = "0.11"
features = ["json"]
optional = true

[dependencies.tokio]
version = "1"
features = ["full"]
optional = true

[dependencies.serde_json]
version = "1"
optional = true

[dependencies.async-trait]
version = "0.1"
optional = true
